name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DEBUG: napi:*
  APP_NAME: keyboard_identifier_napi
  CARGO_INCREMENTAL: 1
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------
  # Lint
  # ------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ------------------------------------------------------------
  # Build native platform bindings
  # ------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux-only native dependency required by udev/libudev-sys
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-build-

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build --target ${{ matrix.target }}

      - name: List build artifacts
        shell: bash
        run: |
          echo "Build artifacts:"
          find . -maxdepth 2 -type f \( -name "*.node" -o -name "index.d.ts" \) -print

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: |
            *.node
            index.d.ts

  # ------------------------------------------------------------
  # Test Windows MSVC bindings
  # ------------------------------------------------------------
  test-windows-msvc-binding:
    name: Test Windows MSVC - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-pc-windows-msvc
          path: .

      - name: List files
        run: Get-ChildItem -Recurse
        shell: powershell

      - name: Test bindings
        run: yarn test

  # ------------------------------------------------------------
  # Test Linux bindings
  # ------------------------------------------------------------
  test-linux-binding:
    name: Test Linux GNU - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"
          - "26"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config

      - name: Configure Yarn architectures
        run: |
          yarn config set --json supportedArchitectures.cpu '["current", "x64"]'
          yarn config set --json supportedArchitectures.libc '["current", "gnu"]'
          yarn install

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .

      - name: List files
        run: ls -R .
        shell: bash

      - name: Test bindings
        run: yarn test

  # ------------------------------------------------------------
  # Publish
  # ------------------------------------------------------------
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs:
      - lint
      - test-windows-msvc-binding
      - test-linux-binding
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Create npm directories
        run: yarn napi create-npm-dirs

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts
        run: yarn artifacts

      - name: Verify npm packages
        run: |
          echo "Generated npm packages:"
          find npm -maxdepth 3 -type f -print | sort

      - name: Publish
        shell: bash
        run: |
          npm config set provenance true

          COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

          if echo "$COMMIT_MESSAGE" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Publishing stable release..."
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --access public

          elif echo "$COMMIT_MESSAGE" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "Publishing prerelease..."
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --tag next --access public

          else
            echo "Not a release commit, skipping publish."
          fi
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
