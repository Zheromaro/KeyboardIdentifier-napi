[package]
edition = "2024"
name = "keyboard_identifier_napi"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
keyboard_identifier = "0.1.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "rt-multi-thread"] }
napi-derive = "3.0.0"

[dependencies.napi]
version = "3.0.0"
features = ["napi9", "async", "tokio_rt"]

[build-dependencies]
napi-build = "2"
